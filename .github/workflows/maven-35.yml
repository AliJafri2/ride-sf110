name: "CI: 35_corina"

on:
  push:
    paths:
      - '35_corina/**'
  pull_request:
    paths:
      - '35_corina/**'

jobs:
  build-corina:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build and test with Maven
        working-directory: 35_corina
        run: mvn clean test
