name: Java CI with Maven

on:
  push:
    paths:
      - '32_httpanalyzer/**'
      - '33_javaviewcontrol/**'
      - '34_sbmlreader2/**'
  pull_request:
    paths:
      - '32_httpanalyzer/**'
      - '33_javaviewcontrol/**'
      - '34_sbmlreader2/**'

jobs:
  build-httpanalyzer:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build and test with Maven
        working-directory: 32_httpanalyzer
        run: mvn clean test

  build-javaviewcontrol:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build and test with Maven
        working-directory: 33_javaviewcontrol
        run: mvn clean test

  build-sbmlreader2:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build and test with Maven
        working-directory: 34_sbmlreader2
        run: mvn clean test
