name: "CI: 34_sbmlreader2"

on:
  push:
    paths:
      - '34_sbmlreader2/**'
  pull_request:
    paths:
      - '34_sbmlreader2/**'

jobs:
  build-sbmlreader2:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build and test with Maven
        working-directory: 34_sbmlreader2
        run: mvn clean test
