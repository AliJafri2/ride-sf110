name: "CI: 33_javaviewcontrol"

on:
  push:
    paths:
      - '33_javaviewcontrol/**'
  pull_request:
    paths:
      - '33_javaviewcontrol/**'

jobs:
  build-javaviewcontrol:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build and test with Maven
        working-directory: 33_javaviewcontrol
        run: mvn clean test